name: VCMI - dependencies

on:
  pull_request:
    paths-ignore:
      - README.md
      - .github/workflows/releaseFromRun.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-intel
            artifact: mac-intel
            os: macos-26
            before_install: macos.sh

          - platform: mac-arm
            artifact: mac-arm
            os: macos-26
            before_install: macos.sh

          - platform: ios
            artifact: ios
            os: macos-26
            before_install: macos.sh

          - platform: android-armeabi-v7a
            artifact: android-armeabi-v7a
            os: ubuntu-latest
            before_install: android-32.sh

          - platform: android-arm64-v8a
            artifact: android-arm64-v8a
            os: ubuntu-latest

          - platform: android-x64
            artifact: android-x64
            os: ubuntu-latest

          - platform: windows-x64
            artifact: windows-x64-qt5
            qt_variant: qt5
            os: windows-2025-vs2026

          - platform: windows-x86
            artifact: windows-x86-qt5
            qt_variant: qt5
            os: windows-2025-vs2026

          - platform: windows-x64
            artifact: windows-x64-qt6-8-3
            qt_variant: qt6-8-3
            os: windows-2025-vs2026

          - platform: windows-x86
            artifact: windows-x86-qt6-8-3
            qt_variant: qt6-8-3
            os: windows-2025-vs2026

          - platform: windows-x64
            artifact: windows-x64-qt6-11-1
            qt_variant: qt6-11-1
            os: windows-2025-vs2026

          - platform: windows-x86
            artifact: windows-x86-qt6-11-1
            qt_variant: qt6-11-1
            os: windows-2025-vs2026

          - platform: windows-arm64
            artifact: windows-arm64
            os: windows-11-vs2026-arm

          - platform: linux-x64
            artifact: linux-x64
            os: ubuntu-24.04

          - platform: linux-arm64
            artifact: linux-arm64
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout current
      uses: actions/checkout@v6

    - name: Move Conan storage to the Windows temporary volume
      if: ${{ startsWith(matrix.platform, 'windows') }}
      run: |
        # Qt source, build and package trees coexist during `conan create`.
        # Keep them off the smaller Windows user drive. Other operating systems
        # retain their existing default Conan home.
        echo "CONAN_HOME=${RUNNER_TEMP//\\//}/conan2" >> "$GITHUB_ENV"

    - name: Define common variables
      run: |
        echo BUILD_PLATFORM="${{ matrix.platform }}" >> "$GITHUB_ENV"
        echo QT_VARIANT="${{ matrix.qt_variant }}" >> "$GITHUB_ENV"
        echo DEPS_FILE="dependencies-${{ matrix.artifact }}.txz" >> "$GITHUB_ENV"
        echo DEPS_LIST_FILE="dependencies-${{ matrix.artifact }}.txt" >> "$GITHUB_ENV"

    - name: Prepare CI
      if: ${{ matrix.before_install }}
      run: ci/${{ matrix.before_install }}

    - name: Obtain path to the Windows-aware Perl
      if: ${{ startsWith(matrix.platform, 'windows') }}
      run: |
        windowsPerl=$(which -a perl | fgrep Strawberry)
        echo "WINDOWS_PERL_DIR=$(dirname "$windowsPerl")" >> "$GITHUB_ENV"

    - name: Install MSVC v142 toolset (Windows non-ARM)
      if: ${{ startsWith(matrix.platform, 'windows') && matrix.platform != 'windows-arm64' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath

        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        & $installer modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --quiet --norestart

    - uses: actions/setup-java@v5
      if: ${{ startsWith(matrix.platform, 'android') }}
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Select Android SDK platform for Qt
      if: ${{ startsWith(matrix.platform, 'android') }}
      run: |
        # Qt 5 can't handle minor-versioned SDK platforms (e.g. android-37.2):
        # it picks such a platform as the newest one and then fails to find android.jar in it
        androidPlatform=$(ls "$ANDROID_HOME/platforms" | grep -E '^android-[[:digit:]]+$' | sort --version-sort | tail -n1)
        echo "ANDROID_API_VERSION=$androidPlatform" >> "$GITHUB_ENV"

    - name: Setup Conan Client
      run: |
        pipx install conan
        conan profile detect
        echo 'tools.files.download:retry=50' >> ~/.conan2/global.conf

    - name: Restore Conan cache
      id: conan-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ startsWith(matrix.platform, 'windows') && format('{0}/conan2/p', runner.temp) || '~/.conan2/p' }}
        # Windows artifact names include the Qt variant, preventing packages
        # built with different Qt recipes from sharing the same cache key.
        key: ${{ runner.os }}-conan2-${{ matrix.artifact }}-${{ hashFiles('conanfile.py', 'conan_profiles/**', 'conan_patches/**', '.github/workflows/rebuildDependencies.yml') }}
        restore-keys: |
          ${{ runner.os }}-conan2-${{ matrix.artifact }}-

    - name: Prepare platform tools
      run: |
        BUILD_ACTION=prepare ./build.sh >> "$GITHUB_ENV"

    - name: Configure VS version for Conan
      if: ${{ startsWith(matrix.platform, 'windows') }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsInstallationVersion = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion
        $vsMajor = ($vsInstallationVersion -split '\.')[0]

        $platformToolsPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath platformTools
        # appends to [conf]
        Add-Content -Path $platformToolsPath -Value "tools.microsoft.msbuild:vs_version=$vsMajor"

    - name: Configure MSYS2
      if: ${{ startsWith(matrix.platform, 'windows') && matrix.platform != 'windows-arm64' }}
      shell: pwsh
      run: |
        $msysBash = "C:\msys64\usr\bin\bash.exe"
        $platformToolsPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath platformTools

        # appends to [conf]
        Add-Content -Path $platformToolsPath -Value @"
        tools.microsoft.bash:path=$msysBash
        tools.microsoft.bash:subsystem=msys2
        "@

        Invoke-Expression "& $msysBash -l -c 'pacman -S base-devel gcc --noconfirm'"

    - name: Install system libs recipes
      run: |
        BUILD_ACTION=install_system_libs ./build.sh

    - name: Report disk space before Qt build
      if: ${{ startsWith(matrix.qt_variant, 'qt6-') }}
      shell: pwsh
      run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free, Root -AutoSize

    - name: Build recipes with our patches
      run: |
        BUILD_ACTION=build_recipes_with_patches ./build.sh

    - name: Remove Qt source and build trees
      if: ${{ startsWith(matrix.qt_variant, 'qt6-') }}
      run: |
        # The package is retained; only the large temporary source/build/download
        # folders are removed before ONNX and the remaining dependencies build.
        conan cache clean "qt/*" --source --build --download

    - name: Report disk space after Qt cleanup
      if: ${{ startsWith(matrix.qt_variant, 'qt6-') }}
      shell: pwsh
      run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free, Root -AutoSize

    - name: Build ONNX with our patches
      run: |
        BUILD_ACTION=build_onnx_recipes_with_patches ./build.sh

    - name: Build recipes from PR changes
      run: |
        BUILD_ACTION=build_recipes_from_cci_pull_requests ./build.sh

    - name: Build custom recipes
      run: |
        BUILD_ACTION=build_custom_recipes ./build.sh

    - name: Build the rest of the dependencies
      run: |
        BUILD_ACTION=build_normal_recipes ./build.sh

    - name: Remove builds and source code
      run: conan cache clean

    - name: Remove build requirements' binaries
      run: |
        BUILD_ACTION=remove_build_requirements_binaries ./build.sh

    - name: Create list of built packages
      run: |
        packageList="$(conan list --format=compact | tail -n +2)"
        echo "$packageList" > "$DEPS_LIST_FILE"
        echo "CONAN_PACKAGES<<EOF
        $packageList
        EOF" >> "$GITHUB_ENV"

    - name: Create dependencies archive
      run: conan cache save --file "$DEPS_FILE" "*:*"

    - name: Save Conan cache
      if: ${{ !cancelled() && steps.conan-cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ startsWith(matrix.platform, 'windows') && format('{0}/conan2/p', runner.temp) || '~/.conan2/p' }}
        key: ${{ steps.conan-cache-restore.outputs.cache-primary-key }}

    - name: Upload binaries list
      uses: actions/upload-artifact@v7
      with:
        name: list of dependencies-${{ matrix.artifact }}
        path: ${{ env.DEPS_LIST_FILE }}
    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: dependencies-${{ matrix.artifact }}
        compression-level: 0
        path: ${{ env.DEPS_FILE }}
